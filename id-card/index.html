<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ID_CARD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Spotlight Effect Styling */
    #spotlight-card {
      position: relative;
      overflow: hidden;
    }
    #spotlight-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(350px circle at var(--mouse-x) var(--mouse-y), rgba(9, 92, 225, 0.15), transparent 40%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 10;
    }
    #spotlight-card:hover::before {
      opacity: 1;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-200">

  <div id="spotlight-card" class="bg-white rounded-3xl shadow-xl p-6 w-[400px] text-center relative">
    
    <div class="flex justify-center">
      <div class="p-1.5 bg-white border-4 border-blue-500 rounded-full inline-block shadow-md">
        <img class="w-36 h-36 rounded-full object-cover" 
             src="https://www.bing.com/th/id/OIP.JlpHCH1Uy9U-SQwxfURkRwAAAA?w=193&h=161&c=8&rs=1&qlt=90&o=6&dpr=1.3&pid=ImgAns&rm=2" 
             alt="MD Ariful Islam">
      </div>
    </div>

    <h1 class="text-3xl font-bold mt-6 text-gray-800">MD Ariful Islam</h1>
    <h2 class="text-xl font-semibold text-blue-500 mt-2">Backend Engineer</h2>

    <p class="text-gray-600 mt-5 max-w-md mx-auto text-m">
      Backend Engineer passionate about building scalable APIs, secure backend systems, and efficient database-driven applications.
    </p>

    <!-- Skill -->
    <div class="flex flex-wrap justify-center gap-2 mt-5">
      <span class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-m font-semibold transition duration-300 hover:scale-105 cursor-pointer">Python</span>
      <span class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-m font-semibold transition duration-300 hover:scale-105 cursor-pointer">Django</span>
      <span class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-m font-semibold transition duration-300 hover:scale-105 cursor-pointer">REST API</span>
      <span class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-m font-semibold transition duration-300 hover:scale-105 cursor-pointer">Express.js</span>
      <span class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-m font-semibold transition duration-300 hover:scale-105 cursor-pointer">Node.js</span>
      <span class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-m font-semibold transition duration-300 hover:scale-105 cursor-pointer">PostgreSQL</span>
      <span class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-m font-semibold transition duration-300 hover:scale-105 cursor-pointer">MongoDB</span>
      <span class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-m font-semibold transition duration-300 hover:scale-105 cursor-pointer">Git</span>
    </div>

    <!-- Buttons -->
    <div class="flex gap-4 mt-8">
      <a href="https://www.linkedin.com/in/shubha-chakma/?isSelfProfile=true" target="_blank" rel="noopener noreferrer" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-medium shadow-lg hover:bg-blue-700 transition duration-300 hover:scale-105 text-center">
        HIRE ME
      </a>
      <a href="https://shubhachakma.vercel.app/" target="_blank" rel="noopener noreferrer" class="flex-1 bg-gray-200 text-gray-800 py-3 rounded-xl font-medium hover:bg-gray-300 transition duration-300 hover:scale-105 text-center">
        PORTFOLIO
      </a>
    </div>

  </div>

  <!-- JavaScript mouse Effect -->
  <script>
    const card = document.getElementById('spotlight-card');

    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      card.style.setProperty('--mouse-x', `${x}px`);
      card.style.setProperty('--mouse-y', `${y}px`);
    });
  </script>

</body>
</html>
